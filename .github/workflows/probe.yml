name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: KuCoin and others
        run: |
          for u in \
            "kucoin-spot|https://api.kucoin.com/api/v1/market/orderbook/level1?symbol=BTC-USDT" \
            "kucoin-futures|https://api-futures.kucoin.com/api/v1/ticker?symbol=XBTUSDTM" \
            "kucoin-futures-funding|https://api-futures.kucoin.com/api/v1/funding-rate/XBTUSDTM/current" \
            "coinbase-trades|https://api.exchange.coinbase.com/products/BTC-USD/trades?limit=3" \
            "gate-spot-trades|https://api.gateio.ws/api/v4/spot/trades?currency_pair=BTC_USDT&limit=3" \
            "gate-futures-trades|https://api.gateio.ws/api/v4/futures/usdt/trades?contract=BTC_USDT&limit=3" \
            "gate-liquidations|https://api.gateio.ws/api/v4/futures/usdt/liq_orders?contract=BTC_USDT&limit=3" \
            "okx-liquidations|https://www.okx.com/api/v5/public/liquidation-orders?instType=SWAP&state=filled&uly=BTC-USDT" \
            "okx-oi|https://www.okx.com/api/v5/public/open-interest?instType=SWAP&instId=BTC-USDT-SWAP" \
            "bitget-oi|https://api.bitget.com/api/v2/mix/market/open-interest?productType=USDT-FUTURES&symbol=BTCUSDT" \
            "mexc-spot|https://api.mexc.com/api/v3/ticker/price?symbol=BTCUSDT" \
            "htx-spot|https://api.huobi.pro/market/detail/merged?symbol=btcusdt"; do
            n=${u%%|*}; url=${u#*|}
            code=$(curl -s -m 15 -o /tmp/o -w "%{http_code}" "$url"); echo "$n => HTTP $code $(head -c 90 /tmp/o | tr '\n' ' ')"
          done
